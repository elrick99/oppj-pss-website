version: 2

updates:
  # Dépendances npm/pnpm
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Abidjan
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      next-ecosystem:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Abidjan
    labels:
      - dependencies
      - github-actions
